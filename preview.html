<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="../../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#007ec2">
  <title>Modelo publicado · Zoom Education</title>
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Montserrat:wght@400;600;700&amp;family=Poppins:wght@600&amp;display=swap" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="brand/logo.webp" alt="Zoom Education for Life" width="157" height="40">
      <span>Treinador de Modelos</span>
    </div>
  </header>
  <main class="single">
    <section id="previewPanel" class="panel">
      <h2>Modelo publicado</h2>
      <p>Link para usar no aplicativo:</p>
      <pre id="url"></pre>
      <p id="status" class="muted" aria-live="polite">Carregando o modelo…</p>
      <div id="previewCamera" class="camera" hidden><video playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
      <img id="previewImage" class="preview-image" alt="Imagem testada" hidden>
      <p id="listening" class="muted" hidden>Ouvindo… os resultados aparecem em cerca de 1 segundo.</p>
      <div class="row">
        <button id="previewToggle" disabled>Ligar câmera</button>
        <button id="previewSwitch" hidden>Trocar câmera</button>
        <label class="button disabled" id="previewFileLabel">Testar imagem <input id="previewFile" type="file" accept="image/*" hidden disabled></label>
      </div>
      <div id="predictions"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js" crossorigin="anonymous"></script>
  <script type="module" src="preview.js"></script>
</body>
</html>
